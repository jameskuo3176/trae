services:
  django:
    build:
      # docker-compose.yml lives in QoR_Recorder; the parent is required so
      # Docker can copy both QoR_Recorder and canonical frontend-vue sources.
      context: ..
      dockerfile: QoR_Recorder/Dockerfile
      target: django-runtime
    image: qor-recorder-django:${IMAGE_TAG:-latest}
    container_name: qor-recorder-django
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEBUG: ${DEBUG:-0}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in QoR_Recorder/.env}
      ENFORCE_SECRET_KEY: ${ENFORCE_SECRET_KEY:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-0}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-0}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-0}
      DB_TYPE: ${DB_TYPE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      PERSISTENCE_MODE: ${PERSISTENCE_MODE:-hybrid}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB: ${MONGODB_DB:-qor_recorder}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-2000}
      DATA_DIR: /app/data
      UPLOAD_FOLDER: /app/uploads
      BACKUP_DIR: /app/backups
      FRONTEND_MODE: ${FRONTEND_MODE:-vue}
      FRONTEND_URL: ${FRONTEND_URL:-/}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mongo:
    image: mongo:7.0
    container_name: qor-recorder-mongo
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - ./mongodbdir:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand('ping').ok ? 0 : 2)"
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 10

  nginx:
    build:
      context: ..
      dockerfile: QoR_Recorder/Dockerfile
      target: frontend-runtime
    image: qor-recorder-web:${IMAGE_TAG:-latest}
    container_name: qor-recorder-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      django:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
